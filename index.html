<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one big action per screen on color blocks, navigation in a floating dock. Single warm-light look by choice. */
@font-face{font-family:Hod;font-weight:400;src:local('Ploni Round AAA'),local('Ploni Round AAA Regular')}

.a-bust{background-image:url(art/bust.png)}.a-clip{background-image:url(art/clip.png)}.a-head{background-image:url(art/head.png)}.a-idea{background-image:url(art/idea.png)}.a-laptop{background-image:url(art/laptop.png)}.a-love{background-image:url(art/love.png)}.a-party{background-image:url(art/party.png)}.a-run{background-image:url(art/run.png)}.a-bell{background-image:url(art/i-bell.png)}.a-cal{background-image:url(art/i-cal.png)}.a-chart{background-image:url(art/i-chart.png)}.a-check{background-image:url(art/i-check.png)}.a-folder{background-image:url(art/i-folder.png)}.a-target{background-image:url(art/i-target.png)}
.app{position:relative;min-height:100%;padding-block:28px 124px;padding-left:max(36px,env(safe-area-inset-left,0px));padding-right:max(36px,env(safe-area-inset-right,0px));overflow-x:hidden}

<script>
/* ---------- helpers ---------- */
var TONES=[{key:'lilac',color:'#D9B8F2',chart:'#8E44C4',name:'סגול'},{key:'coral',color:'#FF9066',chart:'#F0603A',name:'כתום'},{key:'lime',color:'#B7E35A',chart:'#2E9E6B',name:'ירוק'},{key:'sun',color:'#FFC22E',chart:'#E8A317',name:'צהוב'},{key:'pink',color:'#FF9FC9',chart:'#E85A9C',name:'ורוד'}];
var MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function tone(k){return TONES.filter(function(t){return t.key===k})[0]||TONES[0]}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function mkey(s){return s.slice(0,7)}
function mname(k){var p=k.split('-');return MONTHS[+p[1]-1]+' '+p[0]}
function dshort(s){var p=s.split('-');return p[2]+'.'+p[1]}
function fmt(m){m=Math.round(m);return Math.floor(m/60)+':'+pad(m%60)}
function nis(v){var r=Math.round(v*100)/100;return '₪'+r.toLocaleString('en-US',{minimumFractionDigits:r%1?2:0,maximumFractionDigits:2})}
function amt(j){return j.min/60*(j.rate||S.settings.rate)}
function ic(p,fill){return '<svg class="ic'+(fill?' fic':'')+'" viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>'}
var I={trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',play:'<path d="M7 4v16l13-8z"/>',pause:'<rect x="5.5" y="4" width="5" height="16" rx="1.5"/><rect x="13.5" y="4" width="5" height="16" rx="1.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="m9 5 7 7-7 7"/>',check:'<path d="m5 12.5 4.500 4.500L19 7"/>',pen:'<path d="m4 20 1-4.500L16.500 4a2 2 0 0 1 3 3L8 18.500z"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',down:'<path d="m6 9 6 6 6-6"/>',gear:'<circle cx="12" cy="12" r="3.200"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.600 5.600l2.100 2.100M16.300 16.300l2.100 2.100M18.400 5.600l-2.100 2.100M7.700 16.300l-2.100 2.100"/>'};

/* ---------- state ---------- */
var S={ready:false,clients:[],tasks:[],pays:[],settings:{rate:50,goalHours:60,sent:{}},timer:{run:false,startedAt:0,accMs:0,clientId:null,projId:null,job:''}};
var U={screen:'home',clientId:null,projId:null,modal:null,f:{},taskTab:'today',moneyTab:'progress',month:ymd().slice(0,7),repClient:'',openPay:null,nudge:0,focus:false,lastJob:null,track:null,pickClient:null,draftJob:'',taskClient:'',taskDue:'',newTask:'',confirm:null};
var db=null,dl=null,mode='loading',lastScreen=null,lastModal=null,_dirty=false,loaded={};

/* ---------- storage: the artifact database, with a browser copy only if it is unavailable ---------- */
var LS='hodaya-freelance-v1';
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({clients:S.clients,tasks:S.tasks,pays:S.pays,settings:S.settings,timer:S.timer}))}catch(e){}}
function loadLocal(){try{var o=JSON.parse(localStorage.getItem(LS)||'null');if(o)Object.assign(S,o)}catch(e){}}
function failed(e){var q=e&&e.code==='quota_exceeded';popup('idea','לא נשמר',q?'המאגר התמלא. כדאי לגבות ולמחוק ישן.':'בדקי את החיבור ונסי שוב.')}
function clean(o){var c=JSON.parse(JSON.stringify(o));delete c.id;return c}
function put(col,o){if(!db){saveLocal();return}try{db.collection(col).doc(o.id).set(clean(o)).catch(failed)}catch(e){failed(e)}}
function del(col,id){if(!db){saveLocal();return}try{db.collection(col).doc(id).delete().catch(failed)}catch(e){failed(e)}}
function putMeta(name,o){if(!db){saveLocal();return}try{db.doc('meta/'+name).set(JSON.parse(JSON.stringify(o))).catch(failed)}catch(e){failed(e)}}
function sync(){var el=document.activeElement;if(U.modal||(el&&(el.tagName==='INPUT'||el.tagName==='SELECT'))){_dirty=true;return}render()}
function subscribe(){
 function col(name,key){db.collection(name).onSnapshot(function(s){if(s.metadata&&s.metadata.fromCache&&s.empty&&!loaded[key])return;S[key]=s.docs.map(function(d){return Object.assign(JSON.parse(JSON.stringify(d.data())),{id:d.id})});loaded[key]=true;if(loaded.clients&&!S.ready){S.ready=true}sync()},function(){warn('החיבור לשמירה נותק. רענני את הדף.')})}
 col('clients','clients');col('tasks','tasks');col('payments','pays');
 db.doc('meta/settings').onSnapshot(function(s){if(s.exists)S.settings=Object.assign({rate:50,goalHours:60,sent:{}},JSON.parse(JSON.stringify(s.data())));sync()},function(){});
 db.doc('meta/timer').onSnapshot(function(s){if(s.exists){S.timer=Object.assign(S.timer,JSON.parse(JSON.stringify(s.data())));sync()}},function(){});
}
function warn(t){document.getElementById('warn').innerHTML=t?'<div class="warn">'+esc(t)+'</div>':''}

/* ---------- derived ---------- */
function allJobs(){var o=[];S.clients.forEach(function(c){(c.projects||[]).forEach(function(p){(p.jobs||[]).forEach(function(j){o.push({j:j,c:c,p:p})})})});return o}
function sumMin(a){return a.reduce(function(s,x){return s+x.j.min},0)}
function sumAmt(a){return a.reduce(function(s,x){return s+amt(x.j)},0)}
function wrap(c,p){return(p.jobs||[]).map(function(j){return{j:j,c:c,p:p}})}
function clientJobs(c){var o=[];(c.projects||[]).forEach(function(p){o=o.concat(wrap(c,p))});return o}
function getClient(id){return S.clients.filter(function(c){return c.id===id})[0]}
function getProj(c,id){return c?(c.projects||[]).filter(function(p){return p.id===id})[0]:null}
function elapsedMs(){var t=S.timer;return(t.accMs||0)+(t.run?Math.max(0,Date.now()-t.startedAt):0)}
function clockStr(){var s=Math.floor(elapsedMs()/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)}
function hasTimer(){return S.timer.run||(S.timer.accMs||0)>0}
function streak(){var days={};allJobs().forEach(function(x){days[x.j.date]=1});var d=new Date(),n=0,guard=0;if(!days[ymd(d)])d.setDate(d.getDate()-1);while(guard++<400){var w=d.getDay();if(w===5||w===6){d.setDate(d.getDate()-1);continue}if(days[ymd(d)]){n++;d.setDate(d.getDate()-1)}else break}return n}
function prevMonthKey(){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return ymd(d).slice(0,7)}
function nudges(){var o=[],today=ymd();
 var old=allJobs().filter(function(x){return !x.j.payId&&(Date.now()-new Date(x.j.date).getTime())>14*864e5});
 if(old.length)o.push({text:nis(sumAmt(old))+' מחכים לתשלום יותר משבועיים',cta:'לתשלומים',a:'go-money',v:'pay'});
 var pm=prevMonthKey();if(allJobs().some(function(x){return mkey(x.j.date)===pm})&&!(S.settings.sent||{})[pm])o.push({text:'הדוח של '+MONTHS[+pm.slice(5)-1]+' מוכן לשליחה לבוסית',cta:'לדוח',a:'go-report',v:pm});
 var due=S.tasks.filter(function(t){return !t.done&&t.due&&t.due<=today});
 if(due.length)o.push({text:(due[0].due<today?'באיחור: ':'להיום: ')+due[0].title,cta:'למשימות',a:'go',v:'tasks'});
 var un=sumAmt(allJobs().filter(function(x){return !x.j.payId}));
 if(un>0&&!old.length)o.push({text:nis(un)+' עוד בדרך אלייך',cta:'לתשלומים',a:'go-money',v:'pay'});
 if(!o.length)o.push({text:S.clients.length?'כל דקה שנרשמת היא כסף שלא הולך לאיבוד':'פותחים לקוח ראשון, והכל מתחיל לזוז',cta:S.clients.length?'ללקוחות':'לקוח חדש',a:S.clients.length?'go':'add-client',v:'clients'});
 return o}

function userName(){return S.settings.name||(window.claude?'חני':'')}
function saveFile(name,data){if(dl)return dl.save({filename:name,data:data});var u=URL.createObjectURL(new Blob([data])),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000);return Promise.resolve()}
function restoreAll(o){var nc={};o.clients.forEach(function(c){nc[c.id]=1});S.clients.forEach(function(c){if(!nc[c.id])del('clients',c.id)});var nt={};(o.tasks||[]).forEach(function(t){nt[t.id]=1});S.tasks.forEach(function(t){if(!nt[t.id])del('tasks',t.id)});var np={};(o.payments||[]).forEach(function(p){np[p.id]=1});S.pays.forEach(function(p){if(!np[p.id])del('payments',p.id)});S.clients=o.clients;S.tasks=o.tasks||[];S.pays=o.payments||[];if(o.settings)S.settings=Object.assign({rate:50,goalHours:60,sent:{}},o.settings);S.clients.forEach(function(c){put('clients',c)});S.tasks.forEach(function(t){put('tasks',t)});S.pays.forEach(function(p){put('payments',p)});putMeta('settings',S.settings);U.modal=null;U.screen='home';render();popup('love','הגיבוי שוחזר','הכל חזר למקום.')}
/* ---------- render ---------- */
function render(){_dirty=false;
 var sc=document.getElementById('screen');
 var key=U.screen+'|'+(U.clientId||'')+'|'+(U.projId||'');
 var html=({home:vHome,clients:vClients,client:vClient,project:vProject,tasks:vTasks,money:vMoney}[U.screen]||vHome)();
 sc.innerHTML='<div class="screen'+(key!==lastScreen?' enter':'')+'">'+html+'</div>';lastScreen=key;
 document.getElementById('dock').innerHTML=vDock();
 document.getElementById('focus').innerHTML=U.focus?vFocus():'';
 var mk=U.modal||'';var m=document.getElementById('modal');
 m.innerHTML=U.modal?'<div class="shade"><div class="modal'+(mk!==lastModal?' enter':'')+'" role="dialog" aria-modal="true">'+vModal()+'</div></div>':'';lastModal=mk;
 tickDom();
}
function vHome(){
 var t=S.timer,run=hasTimer(),h=new Date().getHours();
 var pick=U.pickClient&&getClient(U.pickClient)?U.pickClient:(S.clients[0]&&S.clients[0].id);
 var tc=getClient(run?t.clientId:pick);var bg=tc?tone(tc.tone).color:'#D9B8F2';
 var mk=ymd().slice(0,7),month=allJobs().filter(function(x){return mkey(x.j.date)===mk});
 var goal=(S.settings.goalHours||60)*60,pct=Math.min(100,Math.round(sumMin(month)/goal*100));
 var open=S.tasks.filter(function(x){return x.col==='today'&&!x.done});
 var ns=nudges(),n=ns[U.nudge%ns.length];
 var hello=(h<12?'בוקר טוב':h<17?'צהריים טובים':h<21?'ערב טוב':'לילה טוב')+(userName()?' '+userName():'')+'!';
 var hero='<section class="hero" style="background:'+bg+'"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div>';
 if(!run){
  hero+='<span class="a a-bust pose-hero" role="img" aria-label="הדמותג"></span><div class="hc"><div class="hello yad">'+hello+'</div><div class="digits" data-clock>00:00:00</div><div class="lower"><input id="draftJob" class="bigin" data-bind="draftJob" data-enter="start" aria-label="על מה עובדים עכשיו?" placeholder="על מה עובדים עכשיו?" value="'+esc(U.draftJob)+'"><div class="chips">';
  S.clients.forEach(function(c){hero+='<button class="chip'+(c.id===pick?' on':'')+'" data-a="pick" data-v="'+c.id+'"><i style="background:'+tone(c.tone).color+'"></i>'+esc(c.name)+'</button>'});
  hero+='<button class="chip add" data-a="add-client">'+ic(I.plus)+'לקוח חדש</button></div></div><div class="go"><button class="play" data-a="start" aria-label="התחלת טיימר">'+ic(I.play,1)+'</button><div class="golab">'+(S.clients.length?'יאללה, מתחילים':'קודם פותחים לקוח')+(S.clients.length?'<button class="lnk" data-a="manual-home">או להוסיף שעות ידנית</button>':'')+'</div></div></div>';
 }else{
  hero+='<span class="a a-laptop pose-work" role="img" aria-label="הדמותג עובדת במחשב"></span><div class="hc"><div class="hello yad">'+esc(t.job||'עובדים')+(tc?' · '+esc(tc.name):'')+'</div><div class="digits" data-clock>'+clockStr()+'</div><span class="earn" data-earn></span><div class="go"><button class="play'+(t.run?' run':'')+'" data-a="toggle" aria-label="'+(t.run?'השהיה':'המשך')+'">'+ic(t.run?I.pause:I.play,1)+'</button><button class="btn" data-a="stop">עצירה ושמירה</button><button class="btn white" data-a="focus">מצב ריכוז</button></div></div>';
 }
 hero+='</section>';
 var nextT=open[0];
 var side='<aside class="side"><div class="sc" style="background:var(--lilac)"><span class="a a-target a3d" aria-hidden="true"></span><span class="lab">'+MONTHS[new Date().getMonth()]+' עד עכשיו</span><span class="num">'+nis(sumAmt(month))+'</span><span class="lab" style="margin-bottom:12px">'+fmt(sumMin(month))+' שעות מתוך '+(S.settings.goalHours||60)+(streak()>1?' · רצף '+streak()+' ימים':'')+'</span><div class="bar" role="img" aria-label="'+pct+' אחוז מהיעד"><i style="width:'+pct+'%"></i></div></div>'
 +'<div class="sc" style="background:var(--lime)"><span class="a a-check a3d" aria-hidden="true"></span><span class="lab">הבא בתור</span>'+(nextT?'<button class="nextt" data-a="task-toggle" data-v="'+nextT.id+'"><span class="cb"></span><span>'+esc(nextT.title)+'</span></button>':'<div class="say yad" style="font-size:27px">אין משימות להיום</div><button class="lnk" data-a="go" data-v="tasks" style="margin-top:4px">להוספת משימה</button>')+'</div>'
 +'<div class="sc" style="background:var(--pink)"><span class="a a-bell a3d" aria-hidden="true"></span><span class="lab">שווה לדעת</span><div class="say">'+esc(n.text)+'</div><div style="margin-top:6px"><button class="lnk" data-a="'+n.a+'" data-v="'+esc(n.v)+'">'+esc(n.cta)+'</button>'+(ns.length>1?'<button class="lnk" style="font-weight:500" data-a="next-nudge">אחר כך</button>':'')+'</div></div></aside>';
 return '<div class="home">'+hero+side+'</div>';
}

 'm-save':function(){var f=U.f,m=U.modal;

  if(m==='hours'){var hm=minsOf(f);if(!hm)return;var b2=monthAmt(),r2=addJobTo(f.clientId,f.projId,(f.title||'').trim()||'עבודה ללא שם',hm,f.date||ymd(),f.projId==='new'?((f.proj||'').trim()||'פרויקט חדש'):null);U.modal=null;U.screen='project';U.clientId=f.clientId;U.projId=r2.p.id;U.lastJob=r2.j.id;render();if(!celebrateMonth(b2))popup('clip','נוסף! '+fmt(hm)+' · '+nis(amt(r2.j)),'הכל מסודר בתיקייה');return}
  if(m==='job'){var x=findJob(f.id),jm=minsOf(f);if(!jm)return;x.j.title=(f.title||'').trim()||x.j.title;x.j.min=jm;x.j.date=f.date||x.j.date;saveClient(x.c);closeModal();return}
  if(m==='project-new'){if(!(f.name||'').trim())return;var cn=getClient(U.clientId);cn.projects=cn.projects||[];cn.projects.push({id:uid(),name:f.name.trim(),jobs:[]});saveClient(cn);closeModal();popup('idea','פרויקט חדש!',f.name.trim());return}
  if(m==='project-edit'){if(!(f.name||'').trim())return;var ce=getClient(U.clientId);getProj(ce,U.projId).name=f.name.trim();saveClient(ce);closeModal();return}
  if(m==='client-edit'){if(!(f.name||'').trim())return;var cc=getClient(U.clientId);cc.name=f.name.trim();cc.tone=f.tone;saveClient(cc);closeModal();return}
  if(m==='pay'){var ids=Object.keys(f.sel).filter(function(k){return f.sel[k]});if(!ids.length)return;var pay={id:uid(),date:f.date||ymd(),note:(f.note||'').trim(),createdAt:Date.now()},tot=0,touched={};ids.forEach(function(i){var q=findJob(i);if(q){q.j.payId=pay.id;tot+=amt(q.j);touched[q.c.id]=q.c}});S.pays.push(pay);put('payments',pay);Object.keys(touched).forEach(function(k){saveClient(touched[k])});U.openPay=pay.id;U.screen='money';U.moneyTab='pay';U.modal=null;render();popup('love',nis(tot)+' נכנסו!',ids.length+' עבודות סומנו כשולמו');confetti();return}
  if(m==='welcome'){var wn=(f.uname||'').trim(),wr=parseFloat(f.rate),wg=parseFloat(f.goal);if(!wn||!(wr>0)||!(wg>0))return;S.settings.name=wn;S.settings.rate=wr;S.settings.goalHours=wg;putMeta('settings',S.settings);closeModal();return}
  if(m==='settings'){var rt=parseFloat(f.rate),gl=parseFloat(f.goal);if(!(rt>0)||!(gl>0))return;S.settings.rate=rt;S.settings.goalHours=gl;S.settings.name=(f.uname||'').trim()||S.settings.name||'';putMeta('settings',S.settings);closeModal();return}
 }
};
document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(!el||el.disabled)return;var fn=A[el.getAttribute('data-a')];if(fn)fn(el.getAttribute('data-v'))});
